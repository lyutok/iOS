<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave Example</title>
  <style>
    body {
      margin: 0;
    }
    .hero {
      position: relative;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      padding: 100px 20px;
      text-align: center;
      overflow: hidden;
    }
    .wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      line-height: 0;
    }
    .wave svg {
      width: 100%;
      height: auto;
    }
    .below {
      background: white;
      padding: 100px 20px;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>My Hero Section</h1>
    <p>This is above the wave.</p>
    <div class="wave">
      <svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
        <path fill="#ffffff" fill-opacity="1"
          d="M0,224L80,213.3C160,203,320,181,480,170.7C640,160,800,160,960,165.3C1120,171,1280,181,1360,186.7L1440,192L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z">
        </path>
      </svg>
    </div>
  </section>
  <section class="below">
    <h2>Next Section</h2>
    <p>This is content beneath the wave.</p>
  </section>
</body>
</html>
