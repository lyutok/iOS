<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billequal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<section id="main" class="gradient-background position-relative overflow-hidden">
  <div class="container col-xxl-8 px-4 py-5 position-relative z-2">
    <div class="row flex-lg-row-reverse align-items-center g-5 py-5">
      <div class="col-10 col-sm-8 col-lg-6">
        <img src="./images/BuyList2.png"
             class="d-block mx-lg-auto img-fluid hero-image"
             alt="billequal screenshot"
             height="200"
             loading="lazy">
      </div>
      <div class="col-lg-6">
        <h1 class="display-5 fw-bold lh-1 mb-3">
          Responsive left-aligned hero with image
        </h1>
        <p class="lead">
          Quickly design and customize responsive mobile-first sites with Bootstrap, featuring Sass variables and mixins, responsive grid system, and prebuilt components.
        </p>
        <div class="mb-5 mb-lg-0">
          <a class="me-3" href="#!">
            <img src="./images/app-store-badge.svg" style="height: 3rem">
          </a>
          <div class="page-header-ui-text mt-2 text-xs font-italic">
            * Requires Apple iOS 9.3+
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 🌊 SVG Wave -->
  <div class="wave-divider">
    <svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path fill="#ffffff" d="M0,224L80,213.3C160,203,320,181,480,170.7C640,160,800,160,960,165.3C1120,171,1280,181,1360,186.7L1440,192V320H0Z"></path>
    </svg>
  </div>
</section>

<section class="container my-5 next-section">
  <h2>Next Section</h2>
  <p>This is content beneath the wave.</p>
</section>

</body>
</html>
